# Firebase App Hosting config. Web config values are public (they ship to the browser anyway).
runConfig:
  minInstances: 0
  maxInstances: 2

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: REPLACE_ME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: REPLACE_ME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: REPLACE_ME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: REPLACE_ME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: REPLACE_ME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: REPLACE_ME
  # Added with the notify module (POST /api/notify/reminders):
  # - variable: CRON_SECRET
  #   secret: cron-secret
